                          - phone
                          - tuition
                          - groceries
                          - car
                      coveredBy:
                        type: string
                        enum:
                          - me
                          - family
                          - split
                          - none
                      monthlyCents:
                        type:
                          - integer
                          - "null"
                        minimum: 0
                        maximum: 10000000
                      dueDay:
                        type:
                          - integer
                          - "null"
                        minimum: 1
                        maximum: 31
                    required:
