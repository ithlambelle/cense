  /safe-to-spend/answers:
    put:
      operationId: saveSafeToSpendAnswers
      summary: Save who covers each bill and the amount kept aside
      security:
        - studentSession: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bills:
                  type: array
                  items:
                    type: object
                    properties:
                      bill:
                        type: string
                        enum:
                          - rent
                          - phone
                          - tuition
                          - groceries
                          - car
                      coveredBy:
                        type: string
                        enum:
                          - me
                          - family
                          - split
                          - none
                      monthlyCents:
                        type:
                          - integer
                          - "null"
                        minimum: 0
                        maximum: 10000000
                    required:
                      - bill
                      - coveredBy
                      - monthlyCents
                    additionalProperties: false
                setAsideCents:
                  type: integer
                  minimum: 0
                  maximum: 10000000
              required:
                - bills
                - setAsideCents
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafeToSpend"
        "400":
          description: Invalid answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No bank linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Data unavailable or safe to spend off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
webhooks: {}
