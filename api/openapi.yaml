openapi: 3.1.0
info:
  title: CENSE API
  version: 0.1.0
  description: Shared REST contract for the CENSE web and iOS clients.
  license:
    name: Proprietary
    identifier: LicenseRef-CENSE-Proprietary
servers:
  - url: /api/v1
security: []
components:
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
          required:
            - code
            - message
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    Card:
      type: object
      properties:
        id:
          type: string
        brand:
          type: string
        issuingBank:
          type: string
        name:
          type: string
        catalogRole:
          type: string
          enum:
            - recommend
            - explore
        catalogRoleReason:
          type: string
          minLength: 1
        annualFeeCents:
          type: integer
          minimum: 0
        foreignTransactionFeePercent:
          type: number
          minimum: 0
        preapprovalUrl:
          type:
            - string
            - "null"
          format: uri
        applyUrl:
          type: string
          format: uri
        referralDisclosure:
          type:
            - string
            - "null"
        historyNeeded:
          type: string
          enum:
            - none
            - limited
            - established
            - strong
        minHistoryMonths:
          type:
            - integer
            - "null"
          minimum: 0
        studentsOnly:
          type: boolean
        secured:
          type: boolean
        depositMinCents:
          type: integer
          minimum: 0
        depositMaxCents:
          type:
            - integer
            - "null"
          minimum: 0
        okForRebuilding:
          type: boolean
        runsCreditCheck:
          type: boolean
        openToNewApplicants:
          type: boolean
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/CardCondition"
        eligibilityEvidence:
          type: object
          properties:
            annualFeeCents:
              $ref: "#/components/schemas/CardFieldEvidence"
            historyNeeded:
              $ref: "#/components/schemas/CardFieldEvidence"
            minHistoryMonths:
              $ref: "#/components/schemas/CardFieldEvidence"
            studentsOnly:
              $ref: "#/components/schemas/CardFieldEvidence"
            secured:
              $ref: "#/components/schemas/CardFieldEvidence"
            depositMinCents:
              $ref: "#/components/schemas/CardFieldEvidence"
            depositMaxCents:
              $ref: "#/components/schemas/CardFieldEvidence"
            okForRebuilding:
              $ref: "#/components/schemas/CardFieldEvidence"
            preapprovalUrl:
              $ref: "#/components/schemas/CardFieldEvidence"
            runsCreditCheck:
              $ref: "#/components/schemas/CardFieldEvidence"
            openToNewApplicants:
              $ref: "#/components/schemas/CardFieldEvidence"
            foreignTransactionFeePercent:
              $ref: "#/components/schemas/CardFieldEvidence"
            issuingBank:
              $ref: "#/components/schemas/CardFieldEvidence"
          required:
            - annualFeeCents
            - historyNeeded
            - minHistoryMonths
            - studentsOnly
            - secured
            - depositMinCents
            - depositMaxCents
            - okForRebuilding
            - preapprovalUrl
            - runsCreditCheck
            - openToNewApplicants
            - foreignTransactionFeePercent
            - issuingBank
          additionalProperties: false
      required:
        - id
        - brand
        - issuingBank
        - name
        - catalogRole
        - catalogRoleReason
        - annualFeeCents
        - foreignTransactionFeePercent
        - preapprovalUrl
        - applyUrl
        - referralDisclosure
        - historyNeeded
        - minHistoryMonths
        - studentsOnly
        - secured
        - depositMinCents
        - depositMaxCents
        - okForRebuilding
        - runsCreditCheck
        - openToNewApplicants
        - conditions
        - eligibilityEvidence
      additionalProperties: false
    CardCondition:
      type: object
      properties:
        kind:
          type: string
          enum:
            - requires_bank_account
            - relationship_helps_approval
            - rewards_need_direct_deposit
            - deposit_by_bank_transfer
            - limit_equals_money_moved
            - no_utilization_reporting
            - graduation_review
            - one_card_per_period
            - income_over_housing_minimum
        affects:
          type: string
          enum:
            - approval
            - rewards
            - deposit
            - credit_building
        text:
          type: string
          minLength: 1
        sourceUrl:
          type: string
          format: uri
        verifiedAt:
          type: string
          format: date
      required:
        - kind
        - affects
        - text
        - sourceUrl
        - verifiedAt
      additionalProperties: false
    CardFieldEvidence:
      type: object
      properties:
        basis:
          type: string
          enum:
            - issuer
            - silent
            - estimate
            - decision
        sourceUrls:
          type: array
          items:
            type: string
            format: uri
          minItems: 1
        verifiedAt:
          type: string
          format: date
      required:
        - basis
        - sourceUrls
        - verifiedAt
      additionalProperties: false
    QuizDraft:
      type: object
      properties:
        answers:
          type: object
          properties:
            under21:
              type: boolean
            incomeBand:
              type: string
              enum:
                - none
                - savings_only
                - under_5k
                - 5k_to_15k
                - over_15k
            student:
              type: boolean
            standing:
              type: string
              enum:
                - none
                - limited
                - established
                - damaged
                - not_sure
            recentDenial:
              type: boolean
            canDeposit:
              type: boolean
            monthlySpendingCents:
              type: integer
              minimum: 0
            goal:
              type: string
              enum:
                - build_credit
                - learn
                - other
          additionalProperties: false
        updatedAt:
          type: string
          format: date-time
      required:
        - answers
        - updatedAt
      additionalProperties: false
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
        cardId:
          type:
            - string
            - "null"
        cardName:
          type: string
        status:
          type: string
          enum:
            - applied
            - approved
            - rejected
        creditLimitCents:
          type:
            - integer
            - "null"
          minimum: 0
        appliedAt:
          type:
            - string
            - "null"
          format: date-time
        statusUpdatedAt:
          type: string
          format: date-time
      required:
        - id
        - cardId
        - cardName
        - status
        - creditLimitCents
        - appliedAt
        - statusUpdatedAt
      additionalProperties: false
    ApplicationDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        cardId:
          type:
            - string
            - "null"
        cardName:
          type: string
        status:
          type: string
          enum:
            - applied
            - approved
            - rejected
        creditLimitCents:
          type:
            - integer
            - "null"
          minimum: 0
        appliedAt:
          type:
            - string
            - "null"
          format: date-time
        statusUpdatedAt:
          type: string
          format: date-time
        denialReason:
          type:
            - string
            - "null"
          enum:
            - no_credit_history
            - could_not_verify
            - report_frozen
            - income
            - something_else
            - no_letter_yet
            - null
        denialReasonNote:
          type:
            - string
            - "null"
          maxLength: 200
        autopayStatus:
          type: string
          enum:
            - on
            - off
            - unknown
        statementClosingDay:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 31
        paymentDueDay:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 31
      required:
        - id
        - cardId
        - cardName
        - status
        - creditLimitCents
        - appliedAt
        - statusUpdatedAt
        - denialReason
        - denialReasonNote
        - autopayStatus
        - statementClosingDay
        - paymentDueDay
      additionalProperties: false
    Recommendation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        cardId:
          type:
            - string
            - "null"
        fitTier:
          type: string
          enum:
            - likely_fit
            - stretch
            - not_yet
        reason:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - cardId
        - fitTier
        - reason
        - createdAt
      additionalProperties: false
    PlanStep:
      type: object
      properties:
        step:
          type: string
          enum:
            - planned_purchase
            - payment_reminder
            - read_letter
            - check_reports
            - pause_applications
            - build_credit
            - reapply
        completedAt:
          type: string
          format: date-time
      required:
        - step
        - completedAt
      additionalProperties: false
    PlanProgress:
      type: object
      properties:
        applicationId:
          type: string
          format: uuid
        plan:
          type: string
          enum:
            - first_month
            - denial
        completedSteps:
          type: array
          items:
            $ref: "#/components/schemas/PlanStep"
      required:
        - applicationId
        - plan
        - completedSteps
      additionalProperties: false
    Reminder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - statement_closing
            - payment_due
            - check_autopay
            - reapply
        occurrence:
          type: string
          format: date
        remindOn:
          type: string
          format: date
        dueAt:
          type: string
          format: date-time
        sentAt:
          type:
            - string
            - "null"
          format: date-time
        actedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - applicationId
        - kind
        - occurrence
        - remindOn
        - dueAt
        - sentAt
        - actedAt
        - createdAt
      additionalProperties: false
    ReminderSettings:
      type: object
      properties:
        emailsOn:
          type: boolean
        statementClosing:
          type: boolean
        paymentDue:
          type: boolean
        checkAutopay:
          type: boolean
      required:
        - emailsOn
        - statementClosing
        - paymentDue
        - checkAutopay
      additionalProperties: false
    SafeToSpend:
      type: object
      properties:
        institutionName:
          type: string
        status:
          type: string
          enum:
            - active
            - reconnect_needed
            - relink_needed
        linkedAt:
          type: string
          format: date-time
        refreshedAt:
          type:
            - string
            - "null"
          format: date-time
        answered:
          type: boolean
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/BankAccount"
        bills:
          type: array
          items:
            type: object
            properties:
              bill:
                type: string
                enum:
                  - rent
                  - phone
                  - tuition
                  - groceries
                  - car
              coveredBy:
                type: string
                enum:
                  - me
                  - family
                  - split
                  - none
              monthlyCents:
                type:
                  - integer
                  - "null"
                minimum: 0
                maximum: 10000000
            required:
              - bill
              - coveredBy
              - monthlyCents
            additionalProperties: false
        setAsideCents:
          type: integer
        cashCents:
          type: integer
        cardCents:
          type: integer
        billsCents:
          type: integer
        leftCents:
          type: integer
        days:
          type: number
          enum:
            - 30
        dailyCents:
          type: integer
      required:
        - institutionName
        - status
        - linkedAt
        - refreshedAt
        - answered
        - accounts
        - bills
        - setAsideCents
        - cashCents
        - cardCents
        - billsCents
        - leftCents
        - days
        - dailyCents
      additionalProperties: false
    BankAccount:
      type: object
      properties:
        name:
          type: string
        mask:
          type:
            - string
            - "null"
        kind:
          type: string
          enum:
            - cash
            - card
            - other
        balanceCents:
          type: integer
      required:
        - name
        - mask
        - kind
        - balanceCents
      additionalProperties: false
    LinkToken:
      type: object
      properties:
        linkToken:
          type: string
        expiration:
          type: string
          format: date-time
        mode:
          type: string
          enum:
            - create
            - update
      required:
        - linkToken
        - expiration
        - mode
      additionalProperties: false
  parameters: {}
  securitySchemes:
    studentSession:
      type: apiKey
      in: header
      name: Cookie
      description: Supabase Auth session cookie
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API availability
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  service:
                    type: string
                    enum:
                      - cense-api
                required:
                  - status
                  - service
                additionalProperties: false
        "500":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/email:
    post:
      operationId: sendEmailCode
      summary: Send a six-digit email code
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - code_sent
                required:
                  - status
                additionalProperties: false
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Email service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/email/verify:
    post:
      operationId: verifyEmailCode
      summary: Verify an email code and create a session
      description: When this code is what confirms the account, any password set
        before it is replaced with a random one and other sessions end.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: ^\d{6}$
              required:
                - email
                - code
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - signed_in
                required:
                  - status
                additionalProperties: false
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Wrong or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Account could not be secured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password/signup:
    post:
      operationId: signUpWithPassword
      summary: Create an optional password account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
              required:
                - email
                - password
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - signed_in
                      - check_email
                required:
                  - status
                additionalProperties: false
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Sign-up unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password/signup/confirm:
    post:
      operationId: confirmPasswordSignUp
      summary: Confirm a password sign-up with the emailed code and set its password
      description: Sets the chosen password and ends other sessions only when this
        code is what confirms the account. An account confirmed earlier keeps
        its password and sessions, and `passwordChanged` is false.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                code:
                  type: string
                  pattern: ^\d{6}$
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
              required:
                - email
                - code
                - password
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - signed_in
                  passwordChanged:
                    type: boolean
                required:
                  - status
                  - passwordChanged
                additionalProperties: false
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Wrong or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Password could not be set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password/signin:
    post:
      operationId: signInWithPassword
      summary: Sign in with an existing password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                password:
                  type: string
                  minLength: 1
              required:
                - email
                - password
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - signed_in
                required:
                  - status
                additionalProperties: false
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Incorrect credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Email not confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password/reset:
    post:
      operationId: requestPasswordReset
      summary: Send a password reset email
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
              required:
                - email
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - check_email
                required:
                  - status
                additionalProperties: false
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Email service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password/reset/verify:
    get:
      operationId: verifyPasswordReset
      summary: Verify a password reset link
      parameters:
        - schema:
            type: string
          required: false
          name: token_hash
          in: query
        - schema:
            type: string
          required: false
          name: code
          in: query
      responses:
        "303":
          description: Redirect to reset form or request a new link
  /auth/password/reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a password with an authenticated reset session
      security:
        - studentSession: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
              required:
                - password
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - password_updated
                required:
                  - status
                additionalProperties: false
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Reset session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Recovery session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Password update failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/google:
    get:
      operationId: startGoogleSignIn
      summary: Start Google sign-in
      parameters:
        - schema:
            type: string
          required: false
          name: next
          in: query
      responses:
        "303":
          description: Redirect to Google
        "502":
          description: Google sign-in unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/callback:
    get:
      operationId: finishGoogleSignIn
      summary: Finish Google sign-in
      parameters:
        - schema:
            type: string
          required: false
          name: code
          in: query
        - schema:
            type: string
          required: false
          name: next
          in: query
      responses:
        "303":
          description: Redirect to the app
        "400":
          description: Missing or invalid code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/logout:
    post:
      operationId: logOut
      summary: End the session
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - signed_out
                required:
                  - status
                additionalProperties: false
        "502":
          description: Sign-out failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me:
    get:
      operationId: getMe
      summary: Get the signed-in student
      security:
        - studentSession: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type:
                      - string
                      - "null"
                    format: email
                required:
                  - id
                  - email
                additionalProperties: false
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /cards:
    get:
      operationId: listCards
      summary: List curated student cards
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:
                    type: array
                    items:
                      $ref: "#/components/schemas/Card"
                required:
                  - cards
                additionalProperties: false
        "503":
          description: Catalog unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /cards/{id}:
    get:
      operationId: getCard
      summary: Get a card
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Success
