                      type: boolean
                    incomeBand:
                      type: string
                      enum:
                        - none
                        - savings_only
                        - under_5k
                        - 5k_to_15k
                        - over_15k
                    student:
                      type: boolean
                    standing:
                      type: string
                      enum:
                        - none
                        - limited
                        - established
                        - damaged
                        - not_sure
                    recentDenial:
                      type: boolean
                    canDeposit:
                      type: boolean
                    monthlySpendingCents:
                      type: integer
                      minimum: 0
                    spendingCategories:
                      type: array
                      items:
                        type: string
                        enum:
                          - food_and_dining
                          - groceries
                          - gas_and_rides
                          - travel_home
                          - shopping_and_subscriptions
                      minItems: 1
                      maxItems: 2
                    spendingBand:
                      type: string
                      enum:
                        - under_200
                        - 200_to_500
                        - over_500
                    goal:
                      type: string
                      enum:
                        - build_credit
                        - learn
                        - other
                  additionalProperties: false
              required:
                - answers
