      description: "Answered from Penny's checked answers, with the source; personal
        details are removed before the model sees it, and nothing about the
        question is stored. A tapped question never calls this: its checked
        answer ships with the app. Each student may ask 20 a day and all
        students 300 (429 penny_limit). 503 penny_unavailable when the model
        cannot answer."
