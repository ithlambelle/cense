openapi: 3.1.0
info:
  title: CENSE API
  version: 0.1.0
  description: Shared REST contract for the CENSE web and iOS clients.
  license:
    name: Proprietary
    identifier: LicenseRef-CENSE-Proprietary
servers:
  - url: /api/v1
security: []
components:
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
          required:
            - code
            - message
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    Card:
      type: object
      properties:
        id:
          type: string
        brand:
          type: string
        issuingBank:
          type: string
        name:
          type: string
        catalogRole:
          type: string
          enum:
            - recommend
            - explore
        catalogRoleReason:
          type: string
          minLength: 1
        annualFeeCents:
          type: integer
          minimum: 0
        foreignTransactionFeePercent:
          type: number
          minimum: 0
        preapprovalUrl:
          type:
            - string
            - "null"
          format: uri
        applyUrl:
          type: string
          format: uri
        referralDisclosure:
          type:
            - string
            - "null"
        historyNeeded:
          type: string
          enum:
            - none
            - limited
            - established
            - strong
        minHistoryMonths:
          type:
            - integer
            - "null"
          minimum: 0
        studentsOnly:
          type: boolean
        secured:
          type: boolean
        depositMinCents:
          type: integer
          minimum: 0
        depositMaxCents:
          type:
            - integer
            - "null"
          minimum: 0
        okForRebuilding:
          type: boolean
        runsCreditCheck:
          type: boolean
        openToNewApplicants:
          type: boolean
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/CardCondition"
        eligibilityEvidence:
          type: object
          properties:
            annualFeeCents:
              $ref: "#/components/schemas/CardFieldEvidence"
            historyNeeded:
              $ref: "#/components/schemas/CardFieldEvidence"
            minHistoryMonths:
              $ref: "#/components/schemas/CardFieldEvidence"
            studentsOnly:
              $ref: "#/components/schemas/CardFieldEvidence"
            secured:
              $ref: "#/components/schemas/CardFieldEvidence"
            depositMinCents:
              $ref: "#/components/schemas/CardFieldEvidence"
            depositMaxCents:
              $ref: "#/components/schemas/CardFieldEvidence"
            okForRebuilding:
              $ref: "#/components/schemas/CardFieldEvidence"
            preapprovalUrl:
              $ref: "#/components/schemas/CardFieldEvidence"
            runsCreditCheck:
              $ref: "#/components/schemas/CardFieldEvidence"
            openToNewApplicants:
              $ref: "#/components/schemas/CardFieldEvidence"
            foreignTransactionFeePercent:
              $ref: "#/components/schemas/CardFieldEvidence"
            issuingBank:
              $ref: "#/components/schemas/CardFieldEvidence"
          required:
            - annualFeeCents
            - historyNeeded
            - minHistoryMonths
            - studentsOnly
            - secured
            - depositMinCents
            - depositMaxCents
            - okForRebuilding
            - preapprovalUrl
            - runsCreditCheck
            - openToNewApplicants
            - foreignTransactionFeePercent
            - issuingBank
          additionalProperties: false
      required:
        - id
        - brand
        - issuingBank
        - name
        - catalogRole
        - catalogRoleReason
        - annualFeeCents
        - foreignTransactionFeePercent
        - preapprovalUrl
        - applyUrl
        - referralDisclosure
        - historyNeeded
        - minHistoryMonths
        - studentsOnly
        - secured
        - depositMinCents
        - depositMaxCents
        - okForRebuilding
        - runsCreditCheck
        - openToNewApplicants
        - conditions
        - eligibilityEvidence
      additionalProperties: false
    CardCondition:
      type: object
      properties:
        kind:
          type: string
          enum:
            - requires_bank_account
            - relationship_helps_approval
            - rewards_need_direct_deposit
            - deposit_by_bank_transfer
            - limit_equals_money_moved
            - no_utilization_reporting
            - graduation_review
            - one_card_per_period
            - income_over_housing_minimum
        affects:
          type: string
          enum:
            - approval
            - rewards
            - deposit
            - credit_building
        text:
          type: string
          minLength: 1
        sourceUrl:
          type: string
          format: uri
        verifiedAt:
          type: string
          format: date
      required:
        - kind
        - affects
        - text
        - sourceUrl
        - verifiedAt
      additionalProperties: false
    CardFieldEvidence:
      type: object
      properties:
        basis:
          type: string
          enum:
            - issuer
            - silent
            - estimate
            - decision
        sourceUrls:
          type: array
          items:
            type: string
            format: uri
          minItems: 1
        verifiedAt:
          type: string
          format: date
      required:
        - basis
        - sourceUrls
        - verifiedAt
      additionalProperties: false
    QuizDraft:
      type: object
      properties:
        answers:
          type: object
          properties:
            under21:
              type: boolean
            incomeBand:
              type: string
              enum:
                - none
                - savings_only
                - under_5k
                - 5k_to_15k
                - over_15k
            student:
              type: boolean
            standing:
              type: string
              enum:
                - none
                - limited
                - established
                - damaged
                - not_sure
            recentDenial:
              type: boolean
            canDeposit:
              type: boolean
            monthlySpendingCents:
              type: integer
              minimum: 0
            spendingCategories:
              type: array
              items:
                type: string
                enum:
                  - food_and_dining
                  - groceries
                  - gas_and_rides
                  - travel_home
                  - shopping_and_subscriptions
              minItems: 1
              maxItems: 2
            spendingBand:
              type: string
              enum:
                - under_200
                - 200_to_500
                - over_500
            goal:
              type: string
              enum:
                - build_credit
                - learn
                - other
          additionalProperties: false
        updatedAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - answers
        - updatedAt
      additionalProperties: false
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
        cardId:
          type:
            - string
            - "null"
        cardName:
          type: string
        status:
          type: string
          enum:
            - applied
            - approved
            - rejected
        creditLimitCents:
          type:
            - integer
            - "null"
          minimum: 0
        appliedAt:
          type:
            - string
            - "null"
          format: date-time
        statusUpdatedAt:
          type: string
          format: date-time
      required:
        - id
        - cardId
        - cardName
        - status
        - creditLimitCents
        - appliedAt
        - statusUpdatedAt
      additionalProperties: false
    ApplicationDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        cardId:
          type:
            - string
            - "null"
        cardName:
          type: string
        status:
          type: string
          enum:
            - applied
            - approved
            - rejected
        creditLimitCents:
          type:
            - integer
            - "null"
          minimum: 0
        appliedAt:
          type:
            - string
            - "null"
          format: date-time
        statusUpdatedAt:
          type: string
          format: date-time
        denialReason:
          type:
            - string
            - "null"
          enum:
            - no_credit_history
            - could_not_verify
            - report_frozen
            - income
            - something_else
            - no_letter_yet
            - null
        denialReasonNote:
          type:
            - string
            - "null"
          maxLength: 200
        autopayStatus:
          type: string
          enum:
            - on
            - off
            - unknown
        autopayPaymentType:
          type:
            - string
            - "null"
          enum:
            - statement_balance
            - minimum
            - fixed_amount
            - null
        spendLimitCents:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0
        statementClosingDay:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 31
        paymentDueDay:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 31
      required:
        - id
        - cardId
        - cardName
        - status
        - creditLimitCents
        - appliedAt
        - statusUpdatedAt
        - denialReason
        - denialReasonNote
        - autopayStatus
        - autopayPaymentType
        - spendLimitCents
        - statementClosingDay
        - paymentDueDay
      additionalProperties: false
    Recommendation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        cardId:
          type:
            - string
            - "null"
        fitTier:
          type: string
          enum:
            - likely_fit
            - stretch
            - not_yet
        reason:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - cardId
        - fitTier
        - reason
        - createdAt
      additionalProperties: false
    PlanStep:
      type: object
      properties:
        step:
          type: string
          enum:
            - planned_purchase
            - spend_limit
            - payment_reminder
            - read_letter
            - check_reports
            - pause_applications
            - build_credit
            - reapply
        completedAt:
          type: string
          format: date-time
      required:
        - step
        - completedAt
      additionalProperties: false
    PlanProgress:
      type: object
      properties:
        applicationId:
          type: string
          format: uuid
        plan:
          type: string
          enum:
            - first_month
            - denial
        completedSteps:
          type: array
          items:
            $ref: "#/components/schemas/PlanStep"
      required:
        - applicationId
        - plan
        - completedSteps
      additionalProperties: false
    Reminder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - statement_closing
            - payment_due
            - check_autopay
            - reapply
        occurrence:
          type: string
          format: date
        remindOn:
          type: string
          format: date
        dueAt:
          type: string
          format: date-time
        sentAt:
          type:
            - string
            - "null"
          format: date-time
        actedAt:
          type:
            - string
            - "null"
          format: date-time
        readAt:
          type:
            - string
            - "null"
          format: date-time
        snoozedUntil:
          type:
            - string
            - "null"
          format: date-time
        dismissedAt:
          type:
            - string
            - "null"
          format: date-time
        followUpAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - applicationId
        - kind
        - occurrence
        - remindOn
        - dueAt
        - sentAt
        - actedAt
        - readAt
        - snoozedUntil
        - dismissedAt
        - followUpAt
        - createdAt
      additionalProperties: false
    ReminderSettings:
      type: object
      properties:
        emailsOn:
          type: boolean
        statementClosing:
          type: boolean
        paymentDue:
          type: boolean
        checkAutopay:
          type: boolean
      required:
        - emailsOn
        - statementClosing
        - paymentDue
        - checkAutopay
      additionalProperties: false
    SavedReapplyReminder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        applicationId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - statement_closing
            - payment_due
            - check_autopay
            - reapply
        occurrence:
          type: string
          format: date
        remindOn:
          type: string
          format: date
        dueAt:
          type: string
          format: date-time
        sentAt:
          type:
            - string
            - "null"
          format: date-time
        actedAt:
          type:
            - string
            - "null"
          format: date-time
        readAt:
          type:
            - string
            - "null"
          format: date-time
        snoozedUntil:
          type:
            - string
            - "null"
          format: date-time
        dismissedAt:
          type:
            - string
            - "null"
          format: date-time
        followUpAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        confirmation:
          type: string
          enum:
            - sent
            - skipped
            - failed
      required:
        - id
        - applicationId
        - kind
        - occurrence
        - remindOn
        - dueAt
        - sentAt
        - actedAt
        - readAt
        - snoozedUntil
        - dismissedAt
        - followUpAt
        - createdAt
        - confirmation
      additionalProperties: false
    ReminderConfirmation:
      type: object
      properties:
        confirmation:
          type: string
          enum:
            - sent
            - skipped
            - failed
      required:
        - confirmation
      additionalProperties: false
    MarkRemindersRead:
      type: object
      properties:
        marked:
          type: integer
          minimum: 0
      required:
        - marked
      additionalProperties: false
    IssuerClick:
      type: object
      properties:
        id:
          type:
            - string
            - "null"
          format: uuid
        cardId:
          type: string
        kind:
          type: string
          enum:
            - preapproval
            - apply
        url:
          type: string
          format: uri
        clickedAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - cardId
        - kind
        - url
        - clickedAt
      additionalProperties: false
    PennyReply:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
                - answer
            text:
              type: string
            answer:
              type: object
              properties:
                id:
                  type: string
                question:
                  type: string
                topic:
                  type: string
                  enum:
                    - credit
                    - budgeting
                    - saving
                    - student-loans
                source:
                  type: object
                  properties:
                    name:
                      type: string
                    url:
                      type: string
                      format: uri
                  required:
                    - name
                    - url
                  additionalProperties: false
              required:
                - id
                - question
                - topic
                - source
              additionalProperties: false
          required:
            - kind
            - text
            - answer
          additionalProperties: false
        - type: object
          properties:
            kind:
              type: string
              enum:
                - declined
            reason:
              type: string
              enum:
                - advice
                - off_topic
                - unknown
                - crisis
            text:
              type: string
            suggestions:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  question:
                    type: string
                required:
                  - id
                  - question
                additionalProperties: false
              maxItems: 2
          required:
            - kind
            - reason
            - text
            - suggestions
          additionalProperties: false
    SafeToSpend:
      type: object
      properties:
        institutionName:
          type: string
        status:
          type: string
          enum:
            - active
            - reconnect_needed
            - relink_needed
        linkedAt:
          type: string
          format: date-time
        refreshedAt:
          type:
            - string
            - "null"
          format: date-time
        answered:
          type: boolean
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/BankAccount"
        bills:
          type: array
          items:
            type: object
            properties:
              bill:
                type: string
                enum:
                  - rent
                  - phone
                  - tuition
                  - groceries
                  - car
              coveredBy:
                type: string
                enum:
                  - me
                  - family
                  - split
                  - none
              monthlyCents:
                type:
                  - integer
                  - "null"
                minimum: 0
                maximum: 10000000
              dueDay:
                type:
                  - integer
                  - "null"
                minimum: 1
                maximum: 31
            required:
              - bill
              - coveredBy
              - monthlyCents
              - dueDay
            additionalProperties: false
        setAsideCents:
          type: integer
        cashCents:
          type: integer
        cardCents:
          type: integer
        billsCents:
          type: integer
        leftCents:
          type: integer
        days:
          type: number
          enum:
            - 30
        dailyCents:
          type: integer
      required:
        - institutionName
        - status
        - linkedAt
        - refreshedAt
        - answered
        - accounts
        - bills
        - setAsideCents
        - cashCents
        - cardCents
        - billsCents
        - leftCents
        - days
        - dailyCents
      additionalProperties: false
    BankAccount:
      type: object
      properties:
        name:
          type: string
        mask:
          type:
            - string
            - "null"
        kind:
          type: string
          enum:
            - cash
            - card
            - other
        balanceCents:
          type: integer
      required:
        - name
        - mask
        - kind
        - balanceCents
      additionalProperties: false
    LinkToken:
      type: object
      properties:
        linkToken:
          type: string
        expiration:
          type: string
          format: date-time
        mode:
          type: string
          enum:
            - create
            - update
      required:
        - linkToken
        - expiration
        - mode
      additionalProperties: false
    Budget:
      type: object
      properties:
        month:
          type: string
          format: date
        hasBankData:
          type: boolean
        income:
          $ref: "#/components/schemas/BudgetLine"
        needs:
          type: array
          items:
            $ref: "#/components/schemas/BudgetLine"
        wants:
          type: array
          items:
            $ref: "#/components/schemas/BudgetLine"
        saving:
          $ref: "#/components/schemas/BudgetLine"
        remainingCents:
          type: integer
        shortfallCents:
          type: integer
        fixedOverIncome:
          type: boolean
      required:
        - month
        - hasBankData
        - income
        - needs
        - wants
        - saving
        - remainingCents
        - shortfallCents
        - fixedOverIncome
      additionalProperties: false
    BudgetLine:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        group:
          type: string
          enum:
            - income
            - need
            - want
            - saving
        amountCents:
          type: integer
        bankCents:
          type:
            - integer
            - "null"
        typed:
          type: boolean
        recurrence:
          type:
            - string
            - "null"
          enum:
            - recurring
            - variable
            - null
      required:
        - key
        - label
        - group
        - amountCents
        - bankCents
        - typed
        - recurrence
      additionalProperties: false
    BankFindings:
      type: object
      properties:
        findings:
          type: array
          items:
            $ref: "#/components/schemas/BankFinding"
        answeredFromBank:
          type: boolean
        safeToSpend:
          $ref: "#/components/schemas/SafeToSpend"
        lastMonth:
          allOf:
            - $ref: "#/components/schemas/Budget"
            - type:
                - object
                - "null"
      required:
        - findings
        - answeredFromBank
        - safeToSpend
        - lastMonth
      additionalProperties: false
    BankFinding:
      type: object
      properties:
        key:
          type: string
        kind:
          type: string
          enum:
            - income
            - family
            - rent
            - phone
            - tuition
            - groceries
            - car
        title:
          type: string
        detail:
          type: string
        found:
          type: boolean
      required:
        - key
        - kind
        - title
        - detail
        - found
      additionalProperties: false
  parameters: {}
  securitySchemes:
    studentSession:
      type: apiKey
      in: header
      name: Cookie
      description: Supabase Auth session cookie
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API availability
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  service:
                    type: string
                    enum:
                      - cense-api
                required:
                  - status
                  - service
                additionalProperties: false
        "500":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/email:
    post:
      operationId: sendEmailCode
      summary: Send a six-digit email code
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - code_sent
                required:
                  - status
                additionalProperties: false
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many codes sent to this email or from this address (rate_limited)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Email service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/email/verify:
    post:
      operationId: verifyEmailCode
      summary: Verify an email code and create a session
      description: When this code is what confirms the account, any password set
        before it is replaced with a random one and other sessions end.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: ^\d{6}$
              required:
                - email
                - code
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - signed_in
                required:
                  - status
                additionalProperties: false
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Wrong or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many code checks (rate_limited)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Account could not be secured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The limits could not be checked (sign_in_busy)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password/signup:
    post:
      operationId: signUpWithPassword
      summary: Create an optional password account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
              required:
                - email
                - password
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - signed_in
                      - check_email
                required:
                  - status
                additionalProperties: false
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many emails to this address or from this address (rate_limited)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Sign-up unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password/signup/confirm:
    post:
      operationId: confirmPasswordSignUp
      summary: Confirm a password sign-up with the emailed code and set its password
      description: Sets the chosen password and ends other sessions only when this
        code is what confirms the account. An account confirmed earlier keeps
        its password and sessions, and `passwordChanged` is false.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                code:
                  type: string
                  pattern: ^\d{6}$
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
              required:
                - email
                - code
                - password
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - signed_in
                  passwordChanged:
                    type: boolean
                required:
                  - status
                  - passwordChanged
                additionalProperties: false
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Wrong or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many code checks (rate_limited)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Password could not be set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The limits could not be checked (sign_in_busy)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password/signin:
    post:
      operationId: signInWithPassword
      summary: Sign in with an existing password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                password:
                  type: string
                  minLength: 1
              required:
                - email
                - password
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - signed_in
                required:
                  - status
                additionalProperties: false
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Incorrect credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Email not confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many tries for this email or from this address (rate_limited)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The limits could not be checked (sign_in_busy)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password/reset:
    post:
      operationId: requestPasswordReset
      summary: Send a password reset email
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
              required:
                - email
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - check_email
                required:
                  - status
                additionalProperties: false
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many emails to this address or from this address (rate_limited)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Email service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password/reset/verify:
    get:
      operationId: openPasswordResetLink
      summary: Forward an older reset link to the confirm screen
      description: "Verifies nothing: opening a link never signs anyone in. Redirects
        to /reset-password/confirm with the same token_hash or code."
      parameters:
        - schema:
            type: string
          required: false
          name: token_hash
          in: query
        - schema:
            type: string
          required: false
          name: code
          in: query
      responses:
        "303":
          description: Redirect to /reset-password/confirm
    post:
      operationId: verifyPasswordReset
      summary: Verify a password reset link from the confirm screen's button
      description: Starts the reset session. Refused with 409 `signed_in_as_other`
        when a different account is signed in in this browser, whose session is
        left as it was.
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
                - type: object
                  properties:
                    tokenHash:
                      type: string
                      minLength: 1
                      maxLength: 512
                  required:
                    - tokenHash
                  additionalProperties: false
                - type: object
                  properties:
                    code:
                      type: string
                      minLength: 1
                      maxLength: 512
                  required:
                    - code
                  additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - verified
                required:
                  - status
                additionalProperties: false
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Link expired or already used (invalid_link)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Another account is signed in here (signed_in_as_other)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many tries from this address (rate_limited)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Could not tell who is signed in here (session_check_failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password/reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a password with an authenticated reset session
      security:
        - studentSession: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
              required:
                - password
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - password_updated
                required:
                  - status
                additionalProperties: false
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Reset session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Recovery session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Password update failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
