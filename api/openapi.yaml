  /me:
    get:
      operationId: getMe
      summary: Get the signed-in student
      security:
        - studentSession: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type:
                      - string
                      - "null"
                    format: email
                required:
                  - id
                  - email
                additionalProperties: false
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteMe
      summary: Delete my account
      description: Deletes the student's PostHog person with its events and recordings
        (where analytics runs), then the account and saved data, then signs out.
        Encrypted Plaid tokens and their encryption bindings are queued
        atomically with account deletion for the daily cleanup job, so a Plaid
        outage does not block deletion. A missing cleanup migration refuses
        deletion before any external work.
      security:
        - studentSession: []
      responses:
        "204":
          description: Deleted and signed out
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Deletion failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Deletion not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
