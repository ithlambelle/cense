openapi: 3.1.0
info:
  title: CENSE API
  version: 0.1.0
  description: Shared REST contract for the CENSE web and iOS clients.
  license:
    name: Proprietary
    identifier: LicenseRef-CENSE-Proprietary
servers:
  - url: /api/v1
security: []
components:
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
          required:
            - code
            - message
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    Card:
      type: object
      properties:
        id:
          type: string
        brand:
          type: string
        issuingBank:
          type: string
        name:
          type: string
        catalogRole:
          type: string
          enum:
            - recommend
            - explore
        catalogRoleReason:
          type: string
          minLength: 1
        annualFeeCents:
          type: integer
          minimum: 0
        foreignTransactionFeePercent:
          type: number
          minimum: 0
        preapprovalUrl:
          type:
            - string
            - "null"
          format: uri
        applyUrl:
          type: string
          format: uri
        referralDisclosure:
          type:
            - string
            - "null"
        historyNeeded:
          type: string
          enum:
            - none
            - limited
            - established
            - strong
        minHistoryMonths:
          type:
            - integer
            - "null"
          minimum: 0
        studentsOnly:
          type: boolean
        secured:
          type: boolean
        depositMinCents:
          type: integer
          minimum: 0
        depositMaxCents:
          type:
            - integer
            - "null"
          minimum: 0
        okForRebuilding:
          type: boolean
        runsCreditCheck:
          type: boolean
        openToNewApplicants:
          type: boolean
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/CardCondition"
        eligibilityEvidence:
          type: object
          properties:
            annualFeeCents:
              $ref: "#/components/schemas/CardFieldEvidence"
            historyNeeded:
              $ref: "#/components/schemas/CardFieldEvidence"
            minHistoryMonths:
              $ref: "#/components/schemas/CardFieldEvidence"
            studentsOnly:
              $ref: "#/components/schemas/CardFieldEvidence"
            secured:
              $ref: "#/components/schemas/CardFieldEvidence"
            depositMinCents:
              $ref: "#/components/schemas/CardFieldEvidence"
            depositMaxCents:
              $ref: "#/components/schemas/CardFieldEvidence"
            okForRebuilding:
              $ref: "#/components/schemas/CardFieldEvidence"
            preapprovalUrl:
              $ref: "#/components/schemas/CardFieldEvidence"
            runsCreditCheck:
              $ref: "#/components/schemas/CardFieldEvidence"
            openToNewApplicants:
              $ref: "#/components/schemas/CardFieldEvidence"
            foreignTransactionFeePercent:
              $ref: "#/components/schemas/CardFieldEvidence"
            issuingBank:
              $ref: "#/components/schemas/CardFieldEvidence"
          required:
            - annualFeeCents
            - historyNeeded
            - minHistoryMonths
            - studentsOnly
            - secured
            - depositMinCents
            - depositMaxCents
            - okForRebuilding
            - preapprovalUrl
            - runsCreditCheck
            - openToNewApplicants
            - foreignTransactionFeePercent
            - issuingBank
          additionalProperties: false
      required:
        - id
        - brand
        - issuingBank
        - name
        - catalogRole
        - catalogRoleReason
        - annualFeeCents
        - foreignTransactionFeePercent
        - preapprovalUrl
        - applyUrl
        - referralDisclosure
        - historyNeeded
        - minHistoryMonths
        - studentsOnly
        - secured
        - depositMinCents
        - depositMaxCents
        - okForRebuilding
        - runsCreditCheck
        - openToNewApplicants
        - conditions
        - eligibilityEvidence
      additionalProperties: false
    CardCondition:
      type: object
      properties:
        kind:
          type: string
          enum:
            - requires_bank_account
            - relationship_helps_approval
            - rewards_need_direct_deposit
            - deposit_by_bank_transfer
            - limit_equals_money_moved
            - no_utilization_reporting
            - graduation_review
            - one_card_per_period
            - income_over_housing_minimum
        affects:
          type: string
          enum:
            - approval
            - rewards
            - deposit
            - credit_building
        text:
          type: string
          minLength: 1
        sourceUrl:
          type: string
          format: uri
        verifiedAt:
          type: string
          format: date
      required:
        - kind
        - affects
        - text
        - sourceUrl
        - verifiedAt
      additionalProperties: false
    CardFieldEvidence:
      type: object
      properties:
        basis:
          type: string
          enum:
            - issuer
            - silent
            - estimate
            - decision
        sourceUrls:
          type: array
          items:
            type: string
            format: uri
          minItems: 1
        verifiedAt:
          type: string
          format: date
      required:
        - basis
        - sourceUrls
        - verifiedAt
      additionalProperties: false
    QuizDraft:
      type: object
      properties:
        answers:
          type: object
          properties:
            under21:
              type: boolean
            incomeBand:
              type: string
              enum:
                - none
                - savings_only
                - under_5k
                - 5k_to_15k
                - over_15k
            student:
              type: boolean
            standing:
              type: string
              enum:
                - none
                - limited
                - established
                - damaged
                - not_sure
            recentDenial:
              type: boolean
            canDeposit:
              type: boolean
            monthlySpendingCents:
              type: integer
              minimum: 0
            goal:
              type: string
              enum:
                - build_credit
                - learn
                - other
          additionalProperties: false
        updatedAt:
          type: string
          format: date-time
      required:
        - answers
        - updatedAt
      additionalProperties: false
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
        cardId:
          type:
            - string
            - "null"
        cardName:
          type: string
        status:
          type: string
          enum:
            - applied
            - approved
            - rejected
        creditLimitCents:
          type:
            - integer
            - "null"
          minimum: 0
        appliedAt:
          type:
            - string
            - "null"
          format: date-time
        statusUpdatedAt:
          type: string
          format: date-time
      required:
        - id
        - cardId
        - cardName
        - status
        - creditLimitCents
        - appliedAt
        - statusUpdatedAt
      additionalProperties: false
    Recommendation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        cardId:
          type:
            - string
            - "null"
        fitTier:
          type: string
          enum:
            - likely_fit
            - stretch
            - not_yet
        reason:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - cardId
        - fitTier
        - reason
        - createdAt
      additionalProperties: false
  parameters: {}
  securitySchemes:
    studentSession:
      type: apiKey
      in: header
      name: Cookie
      description: Supabase Auth session cookie
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API availability
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  service:
                    type: string
                    enum:
                      - cense-api
                required:
                  - status
                  - service
                additionalProperties: false
        "500":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/email:
    post:
      operationId: sendEmailCode
      summary: Send a six-digit email code
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - code_sent
                required:
                  - status
                additionalProperties: false
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Email service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/email/verify:
    post:
      operationId: verifyEmailCode
      summary: Verify an email code and create a session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: ^\d{6}$
              required:
                - email
                - code
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - signed_in
                required:
                  - status
                additionalProperties: false
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Wrong or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password/signup:
    post:
      operationId: signUpWithPassword
      summary: Create an optional password account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
              required:
                - email
                - password
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - signed_in
                      - check_email
                required:
                  - status
                additionalProperties: false
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Sign-up unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password/signup/confirm:
    post:
      operationId: confirmPasswordSignUp
      summary: Confirm a password sign-up with the emailed code and set its password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                code:
                  type: string
                  pattern: ^\d{6}$
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
              required:
                - email
                - code
                - password
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - signed_in
                required:
                  - status
                additionalProperties: false
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Wrong or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Password could not be set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password/signin:
    post:
      operationId: signInWithPassword
      summary: Sign in with an existing password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                password:
                  type: string
                  minLength: 1
              required:
                - email
                - password
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - signed_in
                required:
                  - status
                additionalProperties: false
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Incorrect credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Email not confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password/reset:
    post:
      operationId: requestPasswordReset
      summary: Send a password reset email
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
              required:
                - email
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - check_email
                required:
                  - status
                additionalProperties: false
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Email service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/password/reset/verify:
    get:
      operationId: verifyPasswordReset
      summary: Verify a password reset link
      parameters:
        - schema:
            type: string
          required: false
          name: token_hash
          in: query
        - schema:
            type: string
          required: false
          name: code
          in: query
      responses:
        "303":
          description: Redirect to reset form or request a new link
  /auth/password/reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a password with an authenticated reset session
      security:
        - studentSession: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
              required:
                - password
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - password_updated
                required:
                  - status
                additionalProperties: false
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Reset session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Recovery session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Password update failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/google:
    get:
      operationId: startGoogleSignIn
      summary: Start Google sign-in
      parameters:
        - schema:
            type: string
          required: false
          name: next
          in: query
      responses:
        "303":
          description: Redirect to Google
        "502":
          description: Google sign-in unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/callback:
    get:
      operationId: finishGoogleSignIn
      summary: Finish Google sign-in
      parameters:
        - schema:
            type: string
          required: false
          name: code
          in: query
        - schema:
            type: string
          required: false
          name: next
          in: query
      responses:
        "303":
          description: Redirect to the app
        "400":
          description: Missing or invalid code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/logout:
    post:
      operationId: logOut
      summary: End the session
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - signed_out
                required:
                  - status
                additionalProperties: false
        "502":
          description: Sign-out failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me:
    get:
      operationId: getMe
      summary: Get the signed-in student
      security:
        - studentSession: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type:
                      - string
                      - "null"
                    format: email
                required:
                  - id
                  - email
                additionalProperties: false
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /cards:
    get:
      operationId: listCards
      summary: List curated student cards
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:
                    type: array
                    items:
                      $ref: "#/components/schemas/Card"
                required:
                  - cards
                additionalProperties: false
        "503":
          description: Catalog unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /cards/{id}:
    get:
      operationId: getCard
      summary: Get a card
      parameters:
        - schema:
            type: string
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Card"
        "404":
          description: Card not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /quiz:
    get:
      operationId: getQuiz
      summary: Get saved quiz progress
      security:
        - studentSession: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizDraft"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No saved quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Data unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: saveQuiz
      summary: Save partial quiz progress
      security:
        - studentSession: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                answers:
                  type: object
                  properties:
                    under21:
                      type: boolean
                    incomeBand:
                      type: string
                      enum:
                        - none
                        - savings_only
                        - under_5k
                        - 5k_to_15k
                        - over_15k
                    student:
                      type: boolean
                    standing:
                      type: string
                      enum:
                        - none
                        - limited
                        - established
                        - damaged
                        - not_sure
                    recentDenial:
                      type: boolean
                    canDeposit:
                      type: boolean
                    monthlySpendingCents:
                      type: integer
                      minimum: 0
                    goal:
                      type: string
                      enum:
                        - build_credit
                        - learn
                        - other
                  additionalProperties: false
              required:
                - answers
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizDraft"
        "400":
          description: Invalid quiz answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Data unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /applications:
    get:
      operationId: listApplications
      summary: List application status records
      security:
        - studentSession: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  applications:
                    type: array
                    items:
                      $ref: "#/components/schemas/Application"
                required:
                  - applications
                additionalProperties: false
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Data unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createApplication
      summary: Record a self-reported application or owned card
      security:
        - studentSession: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cardId:
                  type:
                    - string
                    - "null"
                  minLength: 1
                  maxLength: 100
                cardName:
                  type: string
                  minLength: 1
                  maxLength: 160
                status:
                  type: string
                  enum:
                    - applied
                    - approved
                    - rejected
                creditLimitCents:
                  type:
                    - integer
                    - "null"
                  minimum: 0
              required:
                - cardId
                - cardName
                - status
                - creditLimitCents
              additionalProperties: false
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Invalid application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Data unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /applications/{id}:
    patch:
      operationId: updateApplication
      summary: Update application status
      security:
        - studentSession: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - applied
                    - approved
                    - rejected
                creditLimitCents:
                  type:
                    - integer
                    - "null"
                  minimum: 0
              required:
                - status
                - creditLimitCents
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Data unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /issuer-clicks:
    post:
      operationId: recordIssuerClick
      summary: Record an issuer link click
      security:
        - studentSession: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
