              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Data unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /applications/{id}:
    patch:
      operationId: updateApplication
      summary: "Update a tracked card: status, credit limit, denial reason and note,
        autopay, closing and due days"
      description: Any of the fields, at least one. A credit limit and the closing and
        due days need an approved card, a denial reason and note a rejected one.
        Saving the days, status or autopay re-plans the card's reminders.
      security:
        - studentSession: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - applied
                    - approved
                    - rejected
                creditLimitCents:
                  type:
                    - integer
                    - "null"
                  minimum: 0
                denialReason:
                  type:
                    - string
                    - "null"
                  enum:
                    - no_credit_history
                    - could_not_verify
                    - report_frozen
                    - income
                    - something_else
                    - no_letter_yet
                    - null
                denialReasonNote:
                  type:
                    - string
                    - "null"
                  maxLength: 200
                autopayStatus:
                  type: string
                  enum:
                    - on
                    - off
                    - unknown
                autopayPaymentType:
                  type:
                    - string
                    - "null"
                  enum:
                    - statement_balance
                    - minimum
                    - fixed_amount
                    - null
                spendLimitCents:
                  type:
                    - integer
                    - "null"
                  exclusiveMinimum: 0
                statementClosingDay:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                  maximum: 31
                paymentDueDay:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                  maximum: 31
              additionalProperties: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "400":
          description: Invalid update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Data unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: getApplication
      summary: Read one tracked card with its denial reason, autopay and closing and
        due days
      security:
        - studentSession: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "400":
          description: Invalid application ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Data unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /applications/{id}/plans/{plan}:
