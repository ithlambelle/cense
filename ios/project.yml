name: Cense
options:
  bundleIdPrefix: com.cense
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Cense:
    type: application
    platform: iOS
    sources:
      - path: Cense
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cense.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets: []

